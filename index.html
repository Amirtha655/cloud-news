<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud News</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #1f2937;
      background-color: #f9fafb;
    }

    body {
      margin: 0;
    }

    .breaking-news-ticker {
      overflow: hidden;
      white-space: nowrap;
      background: #b91c1c;
      color: #ffffff;
      border-bottom: 2px solid #7f1d1d;
      font-weight: 700;
      padding: 0.75rem 0;
    }

    .breaking-news-track {
      display: inline-block;
      padding-left: 100%;
      animation: ticker-scroll 18s linear infinite;
    }

    @keyframes ticker-scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    main {
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="breaking-news-ticker" role="region" aria-label="Breaking news ticker">
    <span class="breaking-news-track">
      Breaking News: New cloud security patch released | AWS price reductions announced for compute workloads | Multi-region outage resolved across major providers
    </span>
  </div>

  <main>
    <h1>Cloud News Dashboard</h1>
    <p>Stay tuned for the latest cloud platform updates.</p>
  </main>
</body>
</html>
